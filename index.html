<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QI do Chat</title>
<!--
  QI DO CHAT — quiz interativo para a live (PlayerNubya)
  =====================================================
  OBS: Fonte > Navegador > marcar "Arquivo local" > escolher este arquivo. Largura 1920, altura 1080.
  Para os sons saírem na live, marque também "Controlar áudio via OBS".

  COMANDOS (você e moderadores, no chat):
    !qi                  começa uma rodada (ou continua depois de pausar)
    !qi games            começa/troca o tema. Temas: games, filmes, series, musica, brasil,
                         historia, literatura, geek, ciencia, curiosidades, esportes, tv,
                         memes, infancia, mitologia, geografia, leis, mix
    !qi dbd              subtemas de games: dbd, cs, re (Resident Evil), sh (Silent Hill),
                         tlou (The Last of Us), minecraft, pokemon, nintendo, zelda, gta,
                         lol, amongus, classicos  ("!qi games" mistura todos eles)
                         filmes: terror, marvel, disney, hp, starwars, nacional, sucessos
                         series: st (Stranger Things), friends, got, animes, variadas
                         musica: anos80, brasileira, rock, kpop, musicageral
    !qi pausa            pausa depois da pergunta atual
    !qi pular            pula a pergunta atual
    !qi relampago        a próxima pergunta vira relâmpago (gemas x2)
    !qi ranking          mostra o ranking (pode usar: !qi ranking hoje | mes | geral)
    !qi fim              encerra a rodada
    !qi abrir / fechar   mostra ou esconde a janela
    !qi som              liga/desliga todos os sons
    !qi trilha           liga/desliga só a música de fundo (gerada pelo jogo, sem DMCA)
    !qi fotos            liga/desliga a arquibancada com as fotos de quem joga
    !qi mascote          liga/desliga o apresentador zoeiro

  MASCOTE: coloque o arquivo mascote.gif (arte do apresentador) na MESMA PASTA
    deste arquivo. Sem ele, o jogo mostra uma TVzinha desenhada como reserva.
    EXPRESSÕES (opcionais): mascote-feliz.gif, mascote-triste.gif, mascote-chocado.gif
    e mascote-dormindo.gif, na mesma pasta. O jogo troca a carinha sozinho conforme
    a situação; sem os arquivos, ele reage com animações em cima do mascote.gif.

  PONTUAÇÃO JUSTA: velocidade contada a partir do primeiro acerto (anula o delay da
    Twitch) e penalidade por erro — ajuste no painel.
    !qi novalive         começa um ranking "Hoje" novo (ele também zera sozinho após 8h sem jogo)
    !qi zerar hoje|mes|tudo   (só você) zera o ranking escolhido

  ESPECTADORES: respondem com A, B, C ou D (vale o 1º voto) e usam !pontos para ver a posição.

  PAINEL DE CONTROLE (botões, editor de perguntas, backup):
    No OBS, crie uma SEGUNDA fonte de navegador apontando para o arquivo
    qi-painel.html (que vem junto com este), deixe ela FORA da tela ou oculta,
    e use clicando nela com o botão direito > Interagir.
    O painel conversa sozinho com a fonte do jogo. Faça backup de vez em quando!

  NUBYACOINS: no painel dá para premiar o campeão da rodada (ou o top 3) com
    pontos do canal do StreamElements. Pegue o JWT Token em streamelements.com >
    avatar > Account > Show secrets, cole no painel e clique em Testar conexão.

  TESTE SEM LIVE: abra no navegador com ?demo no fim do endereço.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --escuro:#2a0619; --vinho:#4a0d2e; --vinho2:#5e1239; --janela:#8a1a52; --janela2:#a12462;
  --interno:#74143f; --rosa:#f2589a; --creme:#f7d4ae; --creme2:#e7b98b; --gema:#ffb43a;
  --verde:#a6dc84; --verde-esc:#4f8a37;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:Montserrat,system-ui,sans-serif;color:var(--creme)}
body.demo{background:radial-gradient(ellipse at 70% 0%,#c2266f 0%,#6b1040 45%,#350a22 100%)}

/* ===== janela ===== */
#colunaquiz{position:absolute;top:2.2vw;width:39.5vw;z-index:2;display:flex;flex-direction:column;gap:.9vw;max-height:calc(100% - 4.4vw)}
#colunaquiz.direita{right:2.2vw}#colunaquiz.esquerda{left:2.2vw}
#colunaquiz.emcima{flex-direction:column-reverse}
.win{flex:0 0 auto;position:relative;width:100%;background:var(--janela);border:.3vw solid var(--escuro);
  box-shadow:.6vw .6vw 0 #0006, inset .25vw .25vw 0 var(--janela2), inset -.25vw -.25vw 0 var(--vinho);
  transform-origin:top center;transition:transform .35s steps(5),opacity .35s steps(5)}
.win.fechada{transform:scale(.5);opacity:0}
.barra{display:flex;align-items:center;gap:.6vw;padding:.9vw 1vw .9vw 1.4vw;border-bottom:.3vw solid var(--vinho)}
.barra .nome{flex:1;font:400 1.15vw "Space Mono",monospace;letter-spacing:.35vw}
.bt{width:2vw;height:2vw;background:var(--creme);border:.18vw solid var(--escuro);display:flex;align-items:center;justify-content:center;font:700 1.1vw "Space Mono",monospace;color:var(--escuro);line-height:1}
.faixa2{height:1.3vw;background:var(--janela2);border-bottom:.3vw solid var(--vinho)}
.corpo{margin:1vw;background:var(--interno);border:.25vw solid var(--vinho);box-shadow:inset .3vw .3vw 0 #5a0f33;padding:1.3vw 3.2vw 1.3vw 1.4vw;position:relative;min-height:12vw}
.rolagem{position:absolute;right:0;top:0;bottom:0;width:2.1vw;background:var(--janela);border-left:.2vw solid var(--vinho)}
.rolagem::before,.rolagem::after{content:"";position:absolute;left:.35vw;width:1.2vw;height:1.2vw;background:var(--janela2)}
.rolagem::before{top:.3vw}.rolagem::after{bottom:.3vw}
.rolagem i{position:absolute;left:.35vw;top:2vw;width:1.2vw;height:5vw;background:var(--janela2);transition:top .4s}
#conteudo.troca{animation:troca .3s steps(3)}
@keyframes troca{0%{opacity:0;transform:translateY(.6vw)}100%{opacity:1;transform:none}}

/* selo relâmpago */
.selo{position:absolute;right:-1.2vw;top:-2.6vw;z-index:2;background:var(--creme);color:var(--vinho);font:400 2.4vw Anton,sans-serif;letter-spacing:.08vw;padding:.2vw 1.1vw;border:.25vw solid var(--escuro);transform:rotate(4deg);box-shadow:.35vw .35vw 0 var(--escuro);display:none;animation:balanca 1.2s ease-in-out infinite}
.selo small{display:block;font:700 .95vw "Space Mono",monospace;letter-spacing:.1vw;text-align:center;margin-top:-.2vw}
.win.relampago .selo{display:block}
@keyframes balanca{50%{transform:rotate(-2deg) scale(1.05)}}

/* cabeçalho */
.cab{display:flex;align-items:center;gap:1vw;margin-bottom:1.1vw}
.tema{white-space:nowrap;background:var(--creme);color:var(--vinho);font:400 1.35vw Anton,sans-serif;letter-spacing:.06vw;padding:.15vw .8vw;border:.2vw solid var(--escuro);transform:rotate(-2deg);box-shadow:.25vw .25vw 0 var(--escuro)}
.cont{font:700 1.05vw "Space Mono",monospace;opacity:.8}
.vida{margin-left:auto;display:flex;align-items:center;gap:.4vw}
.vida svg{width:2.1vw;height:auto}
.vida.pressa svg{animation:bate .5s infinite}
@keyframes bate{50%{transform:scale(1.25)}}
.tubo{width:8vw;height:1.3vw;background:#3d0b26;border:.2vw solid var(--escuro);position:relative}
.tubo b{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--creme);transition:width .25s linear}
.vida.pressa .tubo b{background:var(--rosa)}
.num{font:700 1.2vw "Space Mono",monospace;min-width:2.2vw;text-align:right}

.perg{font:800 1.75vw/1.22 Montserrat,sans-serif;margin:0 0 1.2vw;text-shadow:.15vw .15vw 0 var(--escuro)}
.ops{display:grid;gap:.7vw}
.op{position:relative;overflow:hidden;display:flex;align-items:center;gap:.9vw;background:var(--creme);border:.2vw solid var(--escuro);box-shadow:.3vw .3vw 0 var(--escuro);padding:.45vw .8vw .45vw .45vw;transition:opacity .4s}
.op .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#f2589a59;transition:width .5s}
.op>*:not(.fill){position:relative}
.let{flex:none;width:2.3vw;height:2.3vw;background:var(--janela);color:var(--creme);display:flex;align-items:center;justify-content:center;font:400 1.4vw Anton,sans-serif;border:.18vw solid var(--escuro)}
.op .t{flex:1;font:700 1.25vw "Space Mono",monospace;color:var(--vinho)}
.op .pc{font:700 1.05vw "Space Mono",monospace;color:var(--janela)}
.op.certa{background:var(--verde);animation:acerto .5s steps(4)}
.op.certa .let{background:var(--verde-esc)}
.op.certa .fill{background:#4f8a3733}
.op.certa .t,.op.certa .pc{color:#1f3b14}
.op.errada{opacity:.4}
@keyframes acerto{0%,50%{transform:translateX(-.3vw)}25%,75%{transform:translateX(.3vw)}}

.rodape{margin-top:1.1vw;font:400 1.05vw "Space Mono",monospace;display:flex;justify-content:space-between}
.rodape b{color:var(--gema)}
.cursor{display:inline-block;width:.7vw;height:1.2vw;background:var(--creme);vertical-align:-.15vw;animation:pisca 1s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}

.res{margin-top:1.1vw;border:.2vw dashed var(--creme2);padding:.8vw 1vw;font:400 1.05vw/1.6 "Space Mono",monospace}
.res .grande{font:400 1.9vw Anton,sans-serif;letter-spacing:.05vw;color:var(--verde)}
.res .grande.ruim{color:var(--rosa)}
.res b{color:var(--gema)}
.fogo{display:inline-block;margin:.4vw .4vw 0 0;background:var(--rosa);color:var(--escuro);font-weight:700;padding:.1vw .7vw;border:.18vw solid var(--escuro)}

/* abertura / pausa */
.titulo{text-align:center;padding:.6vw 0 .4vw}
.qi{font:400 6vw/1 Anton,sans-serif;letter-spacing:.15vw;text-shadow:.35vw .35vw 0 var(--escuro)}
.qi span{color:var(--rosa)}
.sub{display:inline-block;margin-top:.8vw;background:var(--creme);color:var(--vinho);font:400 1.5vw Anton,sans-serif;padding:.2vw 1vw;border:.2vw solid var(--escuro);transform:rotate(-2deg);box-shadow:.3vw .3vw 0 var(--escuro)}
.dialogo{margin-top:1.4vw;text-align:center;font:400 1.15vw/1.6 "Space Mono",monospace}
.dialogo b{color:var(--gema)}
.botoes{display:flex;justify-content:center;gap:.8vw;margin:1.1vw 0 .3vw}
.botoes span{width:3.6vw;height:3.2vw;background:var(--creme);border:.2vw solid var(--escuro);box-shadow:.3vw .3vw 0 var(--escuro);display:flex;align-items:center;justify-content:center;font:400 1.8vw Anton,sans-serif;color:var(--vinho)}
.status{text-align:center;font:400 .85vw "Space Mono",monospace;opacity:.7;margin-top:.6vw}
.credito{text-align:center;font:400 .8vw "Space Mono",monospace;opacity:.55;margin-top:.3vw}
.credito b{color:var(--rosa)}

/* ranking */
.abas{display:flex;gap:.4vw;margin-bottom:1vw}
.aba{flex:1;text-align:center;padding:.35vw;font:700 1.05vw "Space Mono",monospace;background:var(--vinho2);border:.18vw solid var(--escuro)}
.aba.on{background:var(--creme);color:var(--vinho);box-shadow:.25vw .25vw 0 var(--escuro)}
.rk{list-style:none;margin:0;padding:0;display:grid;gap:.55vw}
.rk li{display:flex;align-items:center;gap:.8vw;background:var(--vinho2);border:.18vw solid var(--escuro);padding:.45vw .8vw;font:700 1.15vw "Space Mono",monospace;animation:entra .3s steps(3) both}
.rk li:first-child{background:var(--creme);color:var(--vinho);box-shadow:.3vw .3vw 0 var(--escuro);font-size:1.3vw}
@keyframes entra{from{opacity:0;transform:translateX(-1vw)}to{opacity:1;transform:none}}
.rk .pos{width:2.6vw;font:400 1.5vw Anton,sans-serif;text-align:center}
.rk .nm{flex:1;font-family:Montserrat,sans-serif;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .sq{font-size:.9vw;opacity:.75}
.rk .pt{display:flex;align-items:center;gap:.35vw}
.rk .pt svg{width:1.3vw}
.vazio{text-align:center;font:400 1.15vw "Space Mono",monospace;padding:2vw 0;opacity:.8}
.campeao{font:400 1.05vw "Space Mono",monospace;margin:-.2vw 0 .9vw;text-align:center}
.campeao b{color:var(--gema)}

/* arquibancada de jogadores */
#plateia{flex:0 1 auto;min-height:0;overflow:hidden;width:100%;display:flex;flex-wrap:wrap;gap:.9vw .55vw;justify-content:center;align-content:flex-start}
#colunaquiz.emcima #plateia{align-content:flex-end}
#plateia.some{display:none}
.pav{position:relative;width:4.2vw;text-align:center;animation:popin .3s steps(4) both}
#plateia.muitos .pav{width:3.4vw}
#plateia.muitos .pplaca{font-size:.56vw}
#plateia.muitos .pvoto{width:1.15vw;height:1.15vw;font-size:.75vw}
#plateia.lotada .pav{width:2.7vw}
#plateia.lotada .pplaca{font-size:.46vw}
#plateia.lotada .pvoto{width:1vw;height:1vw;font-size:.62vw}
#plateia.lotada .pav.campeao::before{font-size:1vw;top:-1.1vw}
.pborda,.pquadro{clip-path:polygon(0 .38vw,.38vw .38vw,.38vw 0,calc(100% - .38vw) 0,calc(100% - .38vw) .38vw,100% .38vw,100% calc(100% - .38vw),calc(100% - .38vw) calc(100% - .38vw),calc(100% - .38vw) 100%,.38vw 100%,.38vw calc(100% - .38vw),0 calc(100% - .38vw))}
.pborda{background:var(--escuro);padding:.13vw}
.pquadro{background:var(--creme);padding:.3vw;transition:background .3s}
.pquadro img{width:100%;aspect-ratio:1;display:block;background:var(--vinho2)}
.pplaca{position:relative;margin:-.32vw auto 0;width:92%;background:var(--creme);border:.13vw solid var(--escuro);font:700 .64vw "Space Mono",monospace;color:var(--escuro);padding:.1vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:2}
.pvoto{position:absolute;top:-.5vw;right:-.42vw;width:1.4vw;height:1.4vw;display:none;align-items:center;justify-content:center;background:var(--creme);border:.15vw solid var(--escuro);font:400 .9vw Anton,sans-serif;color:var(--vinho);z-index:3;box-shadow:.13vw .13vw 0 var(--escuro)}
.pav.certo .pvoto{display:flex;background:var(--verde);color:#1f3b14}
.pav.errado .pvoto{display:flex;background:var(--creme2);color:var(--vinho)}
.pav.certo .pquadro{background:var(--verde)}
.pav.certo{animation:pulo .55s}
@keyframes pulo{30%{transform:translateY(-.8vw)}60%{transform:translateY(-.2vw)}}
.pav.errado{opacity:.42}
.pav.errado img{filter:grayscale(1)}
.pav.campeao .pquadro,.pav.campeao .pplaca{background:var(--gema)}
.pav.campeao::before{content:"\1F451";position:absolute;top:-1.5vw;left:50%;transform:translateX(-50%);font-size:1.25vw;z-index:4}
.pav.campeao::after{content:"";position:absolute;top:-.7vw;right:-.8vw;width:1.4vw;height:1.2vw;z-index:4;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 6"><path fill="%232a0619" d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/><path fill="%23f2589a" d="M1 1h2v1h1V1h2v2H5v1H4v1H3V4H2V3H1z"/></svg>') no-repeat center/contain;animation:bate2 .8s infinite}
@keyframes bate2{50%{transform:scale(1.25)}}
.pavmais{width:3.3vw;height:3.3vw;display:flex;align-items:center;justify-content:center;background:var(--escuro);color:var(--creme);border:.16vw solid var(--escuro);font:700 .95vw "Space Mono",monospace;align-self:center}

/* pop-ups (!pontos e avisos) */
#pops{position:absolute;bottom:2vw;display:flex;flex-direction:column;gap:.8vw;width:23vw}
#pops.direita{right:2.2vw}#pops.esquerda{left:2.2vw}
.pop{background:var(--janela);border:.25vw solid var(--escuro);box-shadow:.5vw .5vw 0 #0006;animation:popin .3s steps(4)}
.pop.sai{animation:popout .3s steps(4) forwards}
@keyframes popin{from{transform:scale(.6);opacity:0}}
@keyframes popout{to{transform:scale(.6);opacity:0}}
.pop .barra{padding:.5vw .6vw .5vw 1vw}
.pop .barra .nome{font-size:.9vw;letter-spacing:.25vw}
.pop .bt{width:1.5vw;height:1.5vw;font-size:.8vw}
.pop .msg{padding:.8vw 1vw;font:400 1.05vw/1.5 "Space Mono",monospace}
.pop .msg b{color:var(--gema)}
.pop .msg .u{color:var(--rosa);font-weight:700}
/* ===== mascote apresentador ===== */
#mascote{z-index:3;position:absolute;bottom:1vw;display:flex;align-items:flex-end;gap:.8vw}
#mascote.esq{left:2vw}
#mascote.dir{right:2vw;flex-direction:row-reverse}
#mcorpo{animation:mflut 2.6s ease-in-out infinite}
#mcorpo img{width:11vw;display:block;image-rendering:pixelated;filter:drop-shadow(.35vw .35vw 0 #0006)}
#mcorpo.falando img{animation:mfala .2s infinite alternate}
#mcorpo{position:relative}
#mefeito{position:absolute;top:-1.5vw;right:-.5vw;font-size:2vw;line-height:1;opacity:0;transition:opacity .25s;filter:drop-shadow(.15vw .15vw 0 var(--escuro))}
#mcorpo.exp-feliz #mefeito,#mcorpo.exp-triste #mefeito,#mcorpo.exp-chocado #mefeito,#mcorpo.exp-dormindo #mefeito{opacity:1;animation:efpop .5s steps(3)}
@keyframes efpop{from{transform:scale(.3)}}
#mcorpo.exp-feliz img{animation:mpulo .5s 3}
@keyframes mpulo{40%{transform:translateY(-1.3vw)}}
#mcorpo.exp-triste img{transform:rotate(-7deg) translateY(.4vw);filter:saturate(.5) drop-shadow(.35vw .35vw 0 #0006)}
#mcorpo.exp-chocado img{animation:mtremor .12s 8}
@keyframes mtremor{0%{transform:translateX(-.25vw) scale(1.06)}100%{transform:translateX(.25vw) scale(1.06)}}
#mcorpo.exp-dormindo img{filter:brightness(.7) drop-shadow(.35vw .35vw 0 #0006);transform:rotate(4deg) translateY(.3vw)}
@keyframes mflut{50%{transform:translateY(-.4vw)}}
@keyframes mfala{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
#mbalao{position:relative;max-width:26vw;background:var(--escuro);border:.25vw solid var(--rosa);box-shadow:.4vw .4vw 0 #0007;padding:.7vw 1vw;font:400 1.05vw/1.6 "Space Mono",monospace;color:var(--creme);margin-bottom:3vw;opacity:0;transition:opacity .3s;pointer-events:none}
#mbalao.on{opacity:1}
#mbalao::before{content:"";position:absolute;bottom:1.2vw;border:.55vw solid transparent}
#mascote.esq #mbalao::before{left:-1.05vw;border-right-color:var(--rosa)}
#mascote.dir #mbalao::before{right:-1.05vw;border-left-color:var(--rosa)}
#mbalao .mcursor{display:inline-block;width:.55vw;height:1vw;background:var(--creme);vertical-align:-.12vw;animation:pisca 1s steps(1) infinite}
#tvreserva{display:none;width:9vw;position:relative}
#tvreserva .tvcaixa{background:var(--creme);border:.3vw solid var(--escuro);box-shadow:.4vw .4vw 0 #0007,inset -.25vw -.25vw 0 var(--creme2);padding:.6vw;display:flex;gap:.5vw}
#tvreserva .tvtela{flex:1;aspect-ratio:1.1;background:var(--escuro);border:.2vw solid var(--vinho);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vw}
#tvreserva .tvolhos{display:flex;gap:1vw}
#tvreserva .tvolho{width:1vw;height:1vw;background:var(--verde)}
#tvreserva .tvboca{width:2.3vw;height:.4vw;background:var(--verde)}
#tvreserva .tvlado{display:flex;flex-direction:column;gap:.35vw;justify-content:flex-end}
#tvreserva .tvknob{width:.8vw;height:.8vw;border-radius:50%;background:var(--vinho);border:.12vw solid var(--escuro)}
/* confete */
#confetes{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf{position:absolute;top:-2vw;width:.55vw;height:.55vw;animation:confcai linear forwards}
@keyframes confcai{to{transform:translateY(62vw) rotate(620deg)}}
/* vida extra nas telas */
.chips{display:flex;flex-wrap:wrap;gap:.5vw}
.ops .op{animation:opentra .35s both}
.ops .op:nth-child(2){animation-delay:.08s}
.ops .op:nth-child(3){animation-delay:.16s}
.ops .op:nth-child(4){animation-delay:.24s}
@keyframes opentra{from{transform:translateX(1.4vw);opacity:0}}
.win.relampago{animation:tremor .28s steps(2) 4}
@keyframes tremor{25%{transform:translate(.18vw,-.12vw)}75%{transform:translate(-.18vw,.12vw)}}
.win.flashok::after,.win.flashruim::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;animation:flashfade .55s forwards}
.win.flashok::after{background:var(--verde)}

let ac = null;
function audio(){ if (!CONFIG.som) return null; try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch(e){ return null; } return ac; }
function notaAbs(f, t, dur, tipo="square", vol=1){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = tipo; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, CONFIG.volume*0.2*vol), t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
function nota(f, ini, dur, tipo="square", vol=1){
  const a = audio(); if (!a) return;
  notaAbs(f, a.currentTime + ini, dur, tipo, vol);
}

  if (!ruidoBuf){

  return ruidoBuf;
}

/* ---- corda beliscada: modelo físico (Karplus-Strong), pré-gerado uma vez ---- */
const CORDAS = {};
function cordaBuffer(a, midi, variacao){
  const chave = midi + "_" + variacao;
  if (CORDAS[chave]) return CORDAS[chave];
  const sr = a.sampleRate, f = NOTAF(midi);
  const L = Math.max(2, Math.round(sr / f));
  const n = Math.floor(sr * 1.9);
  const buf = a.createBuffer(1, n, sr), out = buf.getChannelData(0);
  const b = new Float32Array(L);
  let z = 0, semente = midi * 7 + variacao * 131;
  const rnd = () => { semente = (semente * 1103515245 + 12345) & 0x7fffffff; return semente / 0x7fffffff * 2 - 1; };
  const corte = Math.exp(-2 * Math.PI * 3200 / sr);
  for (let i = 0; i < L; i++){
    z = (1 - corte) * rnd() + corte * z;
    b[i] = z * (1 - 0.75 * i / L);
  }
  const damp = 0.9965;
  let idx = 0;
  for (let i = 0; i < n; i++){
    const cur = b[idx], nxt = b[(idx + 1) % L];
    out[i] = cur;
    b[idx] = (cur + nxt) * 0.5 * damp;
    idx = (idx + 1) % L;
  }
  const atq = Math.floor(sr * 0.004);
  for (let i = 0; i < atq; i++) out[i] *= i / atq;
  CORDAS[chave] = buf;
  return buf;
}

let _master = null, _rev = null;
function barramento(){
  const a = audio(); if (!a) return null;
  if (!_master){
    const corpo1 = a.createBiquadFilter(); corpo1.type = "peaking"; corpo1.frequency.value = 104; corpo1.Q.value = 7; corpo1.gain.value = 4;
    const corpo2 = a.createBiquadFilter(); corpo2.type = "peaking"; corpo2.frequency.value = 218; corpo2.Q.value = 6; corpo2.gain.value = 2.5;
    _master = a.createGain(); _master.gain.value = 1;
    _master.connect(corpo1).connect(corpo2).connect(a.destination);
    const n = Math.floor(a.sampleRate * 0.5), ir = a.createBuffer(1, n, a.sampleRate), d = ir.getChannelData(0);
    let z = 0; const k = Math.exp(-2 * Math.PI * 3500 / a.sampleRate);
    for (let i = 0; i < n; i++){ z = (1 - k) * (Math.random() * 2 - 1) + k * z; d[i] = z * Math.exp(-i / a.sampleRate * 8); }
    _rev = a.createConvolver(); _rev.buffer = ir;
    const rg = a.createGain(); rg.gain.value = 0.3;
    _rev.connect(rg).connect(corpo1);
  }
  return _master;
}
function ligar(a, no, pan){
  const m = barramento(); if (!m) return;
  if (pan && a.createStereoPanner){
    const p = a.createStereoPanner(); p.pan.value = pan;
    no.connect(p); p.connect(m); if (_rev) p.connect(_rev);
  } else { no.connect(m); if (_rev) no.connect(_rev); }
}

function tocarCorda(midi, t, dur, vol, pan){
  const a = audio(); if (!a) return;
  t = Math.max(t, a.currentTime + 0.002);
  const src = a.createBufferSource();
  src.buffer = cordaBuffer(a, midi, Math.floor(Math.random() * 2));
  src.playbackRate.value = 1 + (Math.random() - 0.5) * 0.004;   // afinação viva
  const g = a.createGain();
  const v = Math.max(0.0006, CONFIG.volume * 0.26 * vol);
  g.gain.setValueAtTime(v, t);
  g.gain.setValueAtTime(v, t + Math.max(0.05, dur - 0.09));
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  src.connect(g); ligar(a, g, pan);
  src.start(t); src.stop(t + dur + 0.05);
}
function tocarBaixo(midi, t, dur, vol){
  const a = audio(); if (!a) return;
  t = Math.max(t, a.currentTime + 0.002);
  const f = NOTAF(midi), g = a.createGain();
  const v = Math.max(0.0008, CONFIG.volume * 0.42 * vol);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [[1, 1], [2, 0.3], [3, 0.1]].forEach(([h, amp]) => {
    const o = a.createOscillator(); o.type = "sine"; o.frequency.value = f * h;
    const hg = a.createGain(); hg.gain.value = amp;
    o.connect(hg).connect(g); o.start(t); o.stop(t + dur + 0.05);
  });
  ligar(a, g, -0.05);
}
function tocarGanza(t, acento){
  const a = audio(); if (!a) return;
  t = Math.max(t, a.currentTime + 0.002);
  const src = a.createBufferSource(); src.buffer = ruidoBuffer(a);
  const hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3800;
  const g = a.createGain();
  const v = Math.max(0.0004, CONFIG.volume * 0.13 * acento);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (acento > 0.9 ? 0.085 : 0.055));
  src.connect(hp).connect(g); ligar(a, g, 0.3);
  src.start(t, Math.random() * 0.2); src.stop(t + 0.12);
}
function tocarAro(t, vol){
  const a = audio(); if (!a) return;
  t = Math.max(t, a.currentTime + 0.002);
  const src = a.createBufferSource(); src.buffer = ruidoBuffer(a);
  const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1750; bp.Q.value = 9;
  const bp2 = a.createBiquadFilter(); bp2.type = "bandpass"; bp2.frequency.value = 420; bp2.Q.value = 6;
  const g = a.createGain();
  const v = Math.max(0.0004, CONFIG.volume * 0.4 * vol);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  src.connect(bp).connect(g); src.connect(bp2).connect(g);
  ligar(a, g, 0.18);
  src.start(t, Math.random() * 0.2); src.stop(t + 0.15);
}
function tocarSurdo(t, vol){
  const a = audio(); if (!a) return;
  t = Math.max(t, a.currentTime + 0.002);
  const o = a.createOscillator(), g = a.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(92, t);
  o.frequency.exponentialRampToValueAtTime(58, t + 0.18);
  const v = Math.max(0.0006, CONFIG.volume * 0.3 * vol);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  o.connect(g); ligar(a, g, 0);
  o.start(t); o.stop(t + 0.45);
}

const TRILHA = (() => {
  const PROG = [[53,57,60,64],[55,58,62,65],[52,55,60,64],[53,57,60,64]];
  const RAIZ = [41, 43, 36, 41];
  const LEVADA = [[0, 1], [0.75, 0.72], [1.5, 0.9], [2.25, 0.68], [3, 0.85], [3.5, 0.6]];
  const CLIMAS = {
    calma:  { bpm: 120, viola: 0.85, ganza: 0.7, surdo: false },
    tensa:  { bpm: 134, viola: 1.0,  ganza: 1.0, surdo: true },
    rapida: { bpm: 156, viola: 1.05, ganza: 1.15, surdo: true }
  };
  let timer = null, tocando = null, proxCompasso = 0, compasso = 0;
  const jitter = f => (Math.random() - 0.5) * f;

  function agendarCompasso(t0, c){
    const b = 60 / c.bpm, i4 = compasso % 4;
    const ac = PROG[i4], rz = RAIZ[i4];
    for (const [k, forca] of LEVADA){
      const jt = jitter(0.016), roll = 0.010 + Math.random() * 0.009;
      const ordem = Math.random() < 0.8 ? ac : ac.slice().reverse();
      ordem.forEach((n, i) => {
        tocarCorda(n, t0 + k * b + jt + i * roll, 2.1 * b,
          forca * (0.84 + Math.random() * 0.3) * c.viola, -0.22 + i * 0.055);
      });
    }
    tocarBaixo(rz, t0 + jitter(0.012), 1.9 * b, 0.9 + Math.random() * 0.2);
    tocarBaixo(rz + 7, t0 + 2 * b + jitter(0.012), 1.9 * b, 0.9 + Math.random() * 0.2);
    if (i4 === 3) tocarBaixo(rz + 10, t0 + 3 * b + jitter(0.01), 0.9 * b, 0.85);
    for (let i = 0; i < 8; i++) tocarGanza(t0 + i * 0.5 * b + jitter(0.012), (i % 2 === 0 ? 1 : 0.62) * c.ganza);
    tocarAro(t0 + 1 * b + jitter(0.014), 1);
    tocarAro(t0 + 2.5 * b + jitter(0.014), 1);
    if (c.surdo && compasso % 2 === 1) tocarSurdo(t0 + 2 * b, 1);
  }
  function loop(){
    try { loopInterno(); } catch(e){ /* áudio nunca derruba o jogo */ }
  }
  function loopInterno(){
    if (!tocando || !CONFIG.trilha) return;
    const a = audio(); if (!a) return;
    const c = CLIMAS[tocando], durC = 4 * 60 / c.bpm;
    if (proxCompasso <= a.currentTime + 0.02) proxCompasso = a.currentTime + 0.1;
    while (proxCompasso < a.currentTime + 1.2){
      agendarCompasso(proxCompasso, c);
      compasso++; proxCompasso += durC;
    }
  }
  return {
    tocar(nome){
      if (!CONFIG.trilha || !CONFIG.som){ this.parar(); return; }
      if (tocando === nome) return;
      tocando = nome; proxCompasso = 0;
      if (!timer) timer = setInterval(loop, 250);
      loop();
    },
    parar(){ tocando = null; },
    nome(){ return tocando; }
  };
})();
function trilhaDoEstado(){
  try { trilhaEstadoInterno(); } catch(e){}
}
function trilhaEstadoInterno(){
  if (estado === "pergunta") TRILHA.tocar(atual && atual.relampago ? "rapida" : "tensa");
  else if (estado === "abertura" || estado === "pausa" || estado === "ranking" || estado === "final") TRILHA.tocar("calma");
  else TRILHA.parar();
}
function vozSino(freq, t, vol){
  const a = audio(); if (!a) return;
  t = Math.max(t, a.currentTime + 0.002);
  const g = a.createGain();
  const v = Math.max(0.0005, CONFIG.volume * 0.16 * vol);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
  [[1, 1], [2.76, 0.28]].forEach(([h, amp]) => {
    const o = a.createOscillator(); o.type = "sine"; o.frequency.value = freq * h;
    const hg = a.createGain(); hg.gain.value = amp;
    o.connect(hg).connect(g); o.start(t); o.stop(t + 1.4);
  });
  ligar(a, g, 0);
}

function sinoRel(f, atraso, vol){ try { const a = audio(); if (!a) return; vozSino(f, a.currentTime + atraso, vol); } catch(e){} }
const SOM = {

  ninguem(){ [392,349,311].forEach((f,i)=>sinoRel(f,i*.16,.5)); },
  relampago(){ for (let i=0;i<5;i++) nota(i%2?740:1180, i*.09, .08, "triangle", .55); },
  vitoria(){ [[523,0],[659,.14],[784,.28],[1046,.42],[784,.72],[1046,.86],[1318,1.0]].forEach(([f,t])=>sinoRel(f,t,.7)); },
  pop(){ sinoRel(1046,0,.35); }
};

/* ---------- sorteio ---------- */
function sortear(grupo){
  const ids = GRUPOS[grupo] || GRUPOS.mix;
  const total = ids.reduce((n,id)=>n+FONTES[id].q.length,0);
  let r = Math.random()*total, id = ids[0];
  for (const x of ids){ r -= FONTES[x].q.length; if (r < 0){ id = x; break; } }
  const lista = FONTES[id].q;
  const usadas = db.usadas[id] || (db.usadas[id] = []);
  let livres = lista.map((_,i)=>i).filter(i=>!usadas.includes(i));
  if (!livres.length){ usadas.length = 0; livres = lista.map((_,i)=>i); }
  const idx = livres[Math.floor(Math.random()*livres.length)];
  usadas.push(idx); salvar();
  const [q, certa, ...erradas] = lista[idx];
  const opcoes = embaralhar([certa, ...erradas]);
  return { q, opcoes, certa: opcoes.indexOf(certa), rotulo: FONTES[id].nome };
}

function somarPontos(tabela, login, nome, pts, combo){
  const r = tabela[login] || (tabela[login] = { nome, pts:0, acertos:0, mc:0 });
  r.nome = nome; r.pts += pts; r.acertos++; r.mc = Math.max(r.mc, combo);
}

function revelar(){
  clearInterval(tick);
  estado = "resultado";
  TRILHA.parar();
  plateiaMarcar();
  garantirSessao(false);
  const mes = db.meses[mesAtual()] || (db.meses[mesAtual()] = {});
  const combos = db.sessao.combos;
  const acertos = [];
  rodada.stats = rodada.stats || {};
  let quebra = null, primeiroErrado = true, tPrimeiro = null;
  [...votos.entries()].sort((a,b)=>a[1].t-b[1].t).forEach(([login,v])=>{
    const stx = rodada.stats[login] || (rodada.stats[login] = { nome: v.nome, acertos: 0, erros: 0, impulso: 0, votos: 0 });
    stx.nome = v.nome; stx.votos++;
    if (v.i !== atual.certa){
      stx.erros++;
      if (primeiroErrado){ stx.impulso++; primeiroErrado = false; }
      if ((combos[login] || 0) >= 4 && (!quebra || combos[login] > quebra.combo)) quebra = { nome: v.nome, combo: combos[login] };
      combos[login] = 0;
      if (CONFIG.penalidadeErro > 0){
        for (const tabela of [rodada.pontos, db.sessao.pontos, mes, db.jogadores]){
          const r = tabela[login]; if (r) r.pts = Math.max(0, r.pts - CONFIG.penalidadeErro);
        }
      }
      return;
    }
    stx.acertos++;
    const combo = (combos[login] || 0) + 1; combos[login] = combo;
    if (tPrimeiro === null) tPrimeiro = v.t;
    const janela = Math.max(1000, Math.min(CONFIG.janelaVelocidade * 1000, atual.dur));
    const frac = Math.max(0, 1 - (v.t - tPrimeiro) / janela);
    const peso = Math.min(1, Math.max(0, +CONFIG.pesoVelocidade || 0));
    let base = Math.round((100 - 50 * peso + 50 * peso * frac) / 5) * 5;
    if (atual.relampago) base *= 2;
    const bonus = combo >= 3 ? Math.min(combo*5, 50) : 0;
    const pts = base + bonus;
    [rodada.pontos, db.sessao.pontos, mes, db.jogadores].forEach(t => somarPontos(t, login, v.nome, pts, combo));
    acertos.push({ login, nome:v.nome, pts, combo, bonus });
  });
  salvar();

  const c = contagem(), tot = votos.size;

    .map(a=>`<span class="fogo">COMBO x${a.combo} · ${esc(a.nome)} +${a.bonus}</span>`).join("");

  tela("QI_DO_CHAT.EXE", `
    <div class="cab"><span class="tema">${esc(atual.rotulo)}</span><span class="cont">${rodada.n}/${rodada.total}</span></div>
    <p class="perg">${esc(atual.q)}</p>
    <div class="ops">${atual.opcoes.map((o,i)=>{
      const pct = tot ? Math.round(c[i]/tot*100) : 0;
      return `<div class="op ${i===atual.certa?"certa":"errada"}"><div class="fill" style="width:${pct}%"></div><span class="let">${LETRAS[i]}</span><span class="t">${esc(o)}</span><span class="pc">${tot?pct+"%":""}</span></div>`;
    }).join("")}</div>
    <div class="res">${frase}${destaques ? "<br>"+destaques : ""}${CONFIG.penalidadeErro > 0 && tot > acertos.length ? `<br><span style="opacity:.7">−${CONFIG.penalidadeErro} gemas para quem errou</span>` : ""}</div>`);
  acertos.length ? SOM.revelar() : SOM.ninguem();
  win.classList.remove("flashok", "flashruim"); void win.offsetWidth;
  win.classList.add(acertos.length ? "flashok" : "flashruim");
  setTimeout(() => win.classList.remove("flashok", "flashruim"), 700);
  const totV = votos.size, nA = acertos.length, pctA = totV ? nA / totV : 0;
  let catF, dadosF = { n: nA, pct: Math.round(pctA * 100) };
  const melhor = acertos.reduce((m, a) => a.combo > (m ? m.combo : 0) ? a : m, null);
  if (!totV) catF = "ninguemVotou";
  else if (!nA) catF = "ninguemAcertou";
  else if (quebra && Math.random() < 0.55){ catF = "comboQuebrado"; dadosF = { nome: quebra.nome, combo: quebra.combo }; }
  else if (melhor && melhor.combo >= 4 && Math.random() < 0.55){ catF = "comboAlto"; dadosF = { nome: melhor.nome, combo: melhor.combo }; }
  else if (pctA >= 0.75) catF = "muitosAcertos";
  else if (pctA <= 0.3) catF = "poucosAcertos";
  else catF = "medioAcertos";
  mascoteFala(catF, dadosF);

  proximo = setTimeout(()=>{
    win.classList.remove("relampago");
    if (rodada.n >= rodada.total) fimDeRodada();
    else if (pausaPedida){ pausaPedida = false; mostrarPausa(); }
    else proximaPergunta();
  }, CONFIG.tempoResultado*1000);
}

function abaDados(aba){
  if (aba === "hoje") return { rotulo:"HOJE", t: db.sessao ? db.sessao.pontos : {} };
  if (aba === "mes") return { rotulo: MESES[new Date().getMonth()], t: db.meses[mesAtual()] || {} };
  return { rotulo:"GERAL", t: db.jogadores };
}
/* duas abas são "a mesma coisa" quando têm os mesmos jogadores com os mesmos pontos */
function assinaturaRank(t){
  return Object.entries(t || {}).map(([l, r]) => l + ":" + r.pts).sort().join("|");
}
function abasDoCiclo(){
  const vistas = [], saida = [];
  for (const aba of ["hoje", "mes", "geral"]){
    const a = assinaturaRank(abaDados(aba).t);
    if (!a) continue;                      // tabela vazia: não mostra
    if (vistas.includes(a)) continue;      // idêntica a uma já mostrada: pula
    vistas.push(a); saida.push(aba);
  }
  return saida.length ? saida : ["hoje"];
}
function mostrarRanking(abaInicial, opcoes = {}){
  clearTimeout(rankTimer); clearInterval(tick);
  estado = "ranking"; abrirJanela();
  trilhaDoEstado();
  const ordem = opcoes.ciclo ? abasDoCiclo() : ["hoje","mes","geral"];
  let i = ordem.indexOf(abaInicial); if (i < 0) i = 0;
  const passos = opcoes.ciclo ? ordem.length : 1;
  let feitos = 0;
  const desenhar = () => {
    const aba = ordem[i];
    const { t } = abaDados(aba);
    const lista = Object.values(t).sort((a,b)=>b.pts-a.pts || b.acertos-a.acertos).slice(0,6);
    tela("RANKING.DOC", `
      ${opcoes.campeao && feitos===0 ? `<div class="campeao">vencedor da rodada: <b>${esc(opcoes.campeao.nome)}</b> · +${fmt(opcoes.campeao.pts)}</div>` : ""}
      ${opcoes.titulos && opcoes.titulos.length && feitos===0 ? `<div class="chips" style="justify-content:center;margin:-.2vw 0 .8vw">${opcoes.titulos.map(t=>`<span class="fogo">&#127941; ${esc(t[0])}: ${esc(t[1])} — ${esc(t[2])}</span>`).join("")}</div>` : ""}
      ${ordem.length > 1 ? `<div class="abas">${ordem.map(a=>`<span class="aba ${a===aba?"on":""}">${abaDados(a).rotulo}</span>`).join("")}</div>`
        : `<div class="abas"><span class="aba on">${abaDados(aba).rotulo}</span></div>`}
      ${lista.length ? `<ul class="rk">${lista.map((r,k)=>`
        <li style="animation-delay:${k*.07}s"><span class="pos">${k+1}º</span><span class="nm">${esc(r.nome)}</span>
        ${r.mc>=3?`<span class="sq">combo ${r.mc}</span>`:""}<span class="pt">${GEMA}${fmt(r.pts)}</span></li>`).join("")}</ul>`
      : `<div class="vazio">ninguém pontuou ainda_</div>`}`);
  };
  const avancar = () => {
    desenhar(); feitos++;
    rankTimer = setTimeout(()=>{
      if (feitos < passos){ i = (i+1) % 3; avancar(); }
      else if (opcoes.depois) opcoes.depois();
      else { estado = "abertura"; mostrarAbertura(); }
    }, opcoes.ciclo ? (passos === 1 ? 11000 : 8000) : 15000);
  };
  avancar();
}

function popup(titulo, html, ms = 5000){
  const caixa = $("#pops");
  while (caixa.children.length >= 3) caixa.firstChild.remove();
  const el = document.createElement("div");
  el.className = "pop";
  el.innerHTML = `<div class="barra"><span class="nome">${esc(titulo)}</span><span class="bt">×</span></div><div class="msg">${html}</div>`;
  caixa.appendChild(el); SOM.pop();
  setTimeout(()=>{ el.classList.add("sai"); setTimeout(()=>el.remove(), 320); }, ms);
}
function posicao(t, login){
  const lista = Object.entries(t).sort((a,b)=>b[1].pts-a[1].pts || b[1].acertos-a[1].acertos);
  const i = lista.findIndex(([l])=>l===login);
  return i < 0 ? null : { pos:i+1, pts:lista[i][1].pts };
}
function cmdPontos(login, nome){
  const agora = Date.now();
  if (agora - (esperaPontos.get(login)||0) < CONFIG.esperaPontos*1000) return;
  esperaPontos.set(login, agora);
  const mes = posicao(db.meses[mesAtual()] || {}, login);
  const hoje = posicao(db.sessao ? db.sessao.pontos : {}, login);
  if (!mes && !hoje){
    popup("!PONTOS", `<span class="u">@${esc(nome)}</span><br>ainda sem gemas. Responda a próxima pergunta!`);
    dizerNoChat("@" + nome + " você ainda não tem gemas. Responda a próxima pergunta do QI do Chat!");
    return;
  }
  popup("!PONTOS", `<span class="u">@${esc(nome)}</span><br>`
    + (mes ? `${mes.pos}º no mês · <b>${fmt(mes.pts)}</b> gemas` : "")
    + (hoje ? `<br>hoje: ${hoje.pos}º · <b>${fmt(hoje.pts)}</b>` : ""));
  dizerNoChat("@" + nome + " " + (mes ? mes.pos + "º no mês com " + fmt(mes.pts) + " gemas" : "")
    + (hoje ? (mes ? " · " : "") + "hoje: " + hoje.pos + "º com " + fmt(hoje.pts) : "") + " 💎");
}

const AV = new Map(); let avExtras = 0;
function corDoNome(login){
  let h = 0; for (const c of login) h = (h * 31 + c.charCodeAt(0)) % 360;
  return "hsl(" + h + ",65%,55%)";
}
function avatarFallback(login, nome){
  const letra = (nome || login || "?").trim()[0].toUpperCase();
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="' + corDoNome(login) + '"/><text x="32" y="44" font-family="monospace" font-size="36" font-weight="bold" text-anchor="middle" fill="#2a0619">' + letra + '</text></svg>';
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
function plateiaMais(){
  let m = document.getElementById("pavmais");
  if (!m){ m = document.createElement("div"); m.id = "pavmais"; m.className = "pavmais"; document.getElementById("plateia").appendChild(m); }
  m.textContent = "+" + avExtras;
}
function plateiaDensidade(){
  const el = document.getElementById("plateia"); if (!el) return;
  const n = AV.size;
  el.classList.toggle("muitos", n > 8 && n <= 14);
  el.classList.toggle("lotada", n > 14);
}
function plateiaAdd(login, nome){
  if (!CONFIG.plateia || AV.has(login)) return;
  if (AV.size >= CONFIG.plateiaMax){ AV.set(login, null); avExtras++; plateiaMais(); return; }
  const el = document.createElement("div");
  el.className = "pav";
  const borda = document.createElement("div"); borda.className = "pborda";
  const quadro = document.createElement("div"); quadro.className = "pquadro";
  const img = document.createElement("img");
  img.alt = ""; img.referrerPolicy = "no-referrer";
  img.onerror = () => { img.onerror = null; img.src = avatarFallback(login, nome); };
  img.src = "https://unavatar.io/twitch/" + encodeURIComponent(login);
  quadro.appendChild(img); borda.appendChild(quadro);
  const voto = document.createElement("span"); voto.className = "pvoto";
  const placa = document.createElement("div"); placa.className = "pplaca"; placa.textContent = nome;
  el.appendChild(borda); el.appendChild(voto); el.appendChild(placa);
  document.getElementById("plateia").appendChild(el);
  AV.set(login, el);
  plateiaDensidade();
}
function plateiaReset(){ AV.forEach(el => { if (el) el.className = "pav"; }); }
function plateiaMarcar(){
  AV.forEach((el, login) => {
    if (!el) return;
    const v = votos.get(login);
    if (v){
      el.className = "pav " + (v.i === atual.certa ? "certo" : "errado");
      el.querySelector(".pvoto").textContent = LETRAS[v.i];
    }
  });
}
function plateiaCampeao(login){ const el = AV.get(login); if (el) el.className = "pav campeao"; }
function plateiaLimpar(){ AV.clear(); avExtras = 0; const el = document.getElementById("plateia"); el.innerHTML = ""; el.classList.remove("muitos", "lotada"); }

let falaTimerM = null, falaSumirM = null, falasUsadas = {};
function escolherFala(cat, dados){
  const lista = FALAS[cat]; if (!lista || !lista.length) return null;
  const us = falasUsadas[cat] = falasUsadas[cat] || [];
  if (us.length >= lista.length) us.length = 0;
  let idx;
  do { idx = Math.floor(Math.random() * lista.length); } while (us.includes(idx));
  us.push(idx);
  let t = lista[idx];
  t = t.split("{streamer}").join(STREAMER || "quem apresenta isso aqui");
  for (const k in (dados || {})) t = t.split("{" + k + "}").join(dados[k]);
  return t;
}
function mascoteFala(cat, dados){
  if (!CONFIG.mascote) return;
  const caixa = document.getElementById("mbalao"), alvo = document.getElementById("mfala"), corpo = document.getElementById("mcorpo");
  if (!caixa || !alvo) return;
  const texto = escolherFala(cat, dados); if (!texto) return;
  mascoteExpressao(EXP_POR_FALA[cat] || "normal");
  clearInterval(falaTimerM); clearTimeout(falaSumirM);
  caixa.classList.add("on"); if (corpo) corpo.classList.add("falando");
  alvo.textContent = ""; let i = 0;
  falaTimerM = setInterval(() => {
    alvo.textContent = texto.slice(0, ++i);
    if (i % 2 === 0 && estado !== "pergunta") nota(300 + Math.random() * 170, 0, 0.04, "square", 0.45);
    if (i >= texto.length){
      clearInterval(falaTimerM);
      if (corpo) corpo.classList.remove("falando");
    }
  }, 30);
  falaSumirM = setTimeout(() => {
    caixa.classList.remove("on");
    if (corpo) corpo.classList.remove("falando");
  }, 8000 + texto.length * 30);
}

/* títulos zoeiros do fim da rodada */
function titulosZoeira(){
  const S = Object.values((rodada && rodada.stats) || {});
  const lista = Object.values((rodada && rodada.pontos) || {}).sort((a, b) => b.pts - a.pts);
  const out = [], ja = new Set(lista[0] ? [lista[0].nome] : []);
  const pega = (titulo, s, info) => { if (s && !ja.has(s.nome)){ out.push([titulo, s.nome, info(s)]); ja.add(s.nome); } };
  pega("CHUTADOR PROFISSIONAL",
    S.filter(s => s.erros >= 3 && s.erros > s.acertos).sort((a, b) => b.erros - a.erros)[0],
    s => s.erros + " erros com orgulho");
  pega("FOI NO IMPULSO",
    S.filter(s => s.impulso >= 2).sort((a, b) => b.impulso - a.impulso)[0],
    s => "o mais rápido a errar, " + s.impulso + "x");
  if (lista[1]) pega("QUASE LÁ", { nome: lista[1].nome }, () => "eterno vice, " + fmt(lista[1].pts) + " gemas");
  if (rodada && rodada.n >= 5) pega("MODO OBSERVADOR",
    S.filter(s => s.votos === 1)[0],
    () => "votou 1x e sumiu");
  return out.slice(0, 3);
}

/* ================= COMANDOS ================= */
function comando(texto, ehDona){
  const partes = normalizar(texto).split(/\s+/).filter(Boolean);
  const c = partes[0] || "", arg = partes[1] || "";
  const aviso = t => popup("SISTEMA", esc(t), 3000);

  if (!c || c === "iniciar" || c === "comecar" || c === "continuar"){
    if (estado === "pausa" && rodada && rodada.n < rodada.total){ abrirJanela(); proximaPergunta(); }
    else if (estado === "resultado" && pausaPedida){ pausaPedida = false; aviso("pausa cancelada"); }
    else if (estado !== "pergunta" && estado !== "resultado") iniciarRodada();
  }
  else if (acharGrupo(partes)){
    temaAtual = acharGrupo(partes);
    const nome = ROTULOS[temaAtual];
    if (estado === "pergunta" || estado === "resultado") aviso("próximas perguntas: " + nome);
    else iniciarRodada();
  }
  else if (c === "pausa" || c === "pausar"){
    if (estado === "pergunta" || estado === "resultado"){ pausaPedida = true; aviso("pausa depois desta pergunta"); }
  }
  else if (c === "pular"){
    if (estado === "pergunta"){ clearInterval(tick); rodada.n--; win.classList.remove("relampago"); aviso("pergunta pulada"); mascoteFala("pular"); proximaPergunta(); }
  }
  else if (c === "relampago"){ forcarRelampago = true; aviso("próxima pergunta: RELÂMPAGO!"); }
  else if (c === "ranking" || c === "placar"){
    if (estado === "pergunta" || estado === "resultado") return;
    const aba = arg.startsWith("mes") ? "mes" : arg.startsWith("ger") ? "geral" : arg.startsWith("hoj") ? "hoje" : null;
    const voltar = estado === "pausa" ? mostrarPausa : mostrarAbertura;
    mostrarRanking(aba || "hoje", { ciclo: !aba, depois: voltar });
  }
  else if (c === "fim" || c === "encerrar"){ if (rodada && estado !== "ranking") fimDeRodada(); }
  else if (c === "abrir" || c === "mostrar"){ abrirJanela(); if (estado === "fechado") mostrarAbertura(); }
  else if (c === "fechar" || c === "esconder"){
    if (estado === "pergunta" || estado === "resultado") return;
    clearTimeout(rankTimer); estado = "fechado"; fecharJanela();
  }
  else if (c === "som"){ CONFIG.som = !CONFIG.som; if (!CONFIG.som) TRILHA.parar(); aviso("sons " + (CONFIG.som ? "ligados" : "desligados")); }
  else if (c === "mascote" || c === "apresentador"){
    CONFIG.mascote = !CONFIG.mascote;
    const m = document.getElementById("mascote"); if (m) m.style.display = CONFIG.mascote ? "" : "none";
    aviso("apresentador " + (CONFIG.mascote ? "ligado" : "desligado"));
  }
  else if (c === "fotos" || c === "arquibancada"){
    CONFIG.plateia = !CONFIG.plateia;
    if (!CONFIG.plateia) plateiaLimpar();
    aviso("fotos dos jogadores " + (CONFIG.plateia ? "ligadas" : "desligadas"));
  }
  else if (c === "trilha"){ CONFIG.trilha = !CONFIG.trilha; CONFIG.trilha ? trilhaDoEstado() : TRILHA.parar(); aviso("música de fundo " + (CONFIG.trilha ? "ligada" : "desligada")); }
  else if (c === "novalive"){ garantirSessao(true); salvar(); aviso("ranking de hoje reiniciado"); }
  else if (c === "zerar" && ehDona){
    if (arg === "hoje"){ garantirSessao(true); aviso("ranking de hoje zerado"); }
    else if (arg === "mes"){ delete db.meses[mesAtual()]; aviso("ranking do mês zerado"); }
    else if (arg === "tudo"){ db = { jogadores:{}, meses:{}, sessao:null, usadas:{} }; garantirSessao(true); aviso("todos os rankings zerados"); }
    salvar();
  }
}

const RE_VOTO = /^\s*([abcd])(?![\p{L}\p{N}])/iu;
function aoMensagem(login, nome, msg, ehMod, ehDona){
  const m = msg.trim();
  if (/^!qi\b/i.test(m)){ if (ehMod || ehDona) comando(m.slice(3), ehDona); return; }
  if (/^!pontos\b/i.test(m)){ cmdPontos(login, nome); return; }
  if (estado !== "pergunta") return;
  const r = RE_VOTO.exec(m);
  if (!r || votos.has(login)) return;
  votos.set(login, { nome, i: LETRAS.indexOf(r[1].toUpperCase()), t: Date.now() });
  plateiaAdd(login, nome);
}
function conectar(){
  if (DEMO){ conectado = true; return; }
  let ws;
  try { ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443"); } catch(e){ setTimeout(conectar, 5000); return; }
  ws.onopen = () => {
    clearTimeout(timerCanal);
    timerCanal = setTimeout(() => {
      if (!conectado && !avisouCanal){
        avisouCanal = true;
        popup("ATENÇÃO", 'não consegui entrar no chat de <span class="u">' + esc(CONFIG.canal) + '</span><br>confira se esse é o nome que aparece no endereço twitch.tv/<b>nome</b>', 20000);
        const st = document.getElementById("status");
        if (st) st.innerHTML = 'canal <b style="color:var(--rosa)">' + esc(CONFIG.canal) + '</b> não encontrado — confira o nome';
      }
    }, 12000);
    ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
    if (BOT_TOKEN && CONFIG.canal){
      ws.send("PASS oauth:" + BOT_TOKEN);
      ws.send("NICK " + CONFIG.canal.toLowerCase().replace(/^#/, ""));
    } else {
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + Math.floor(10000 + Math.random()*80000));
    }
    ws.send("JOIN #" + CONFIG.canal.toLowerCase().replace(/^#/, ""));
  };
  ws.onmessage = e => {
    for (const linha of e.data.split("\r\n")){
      if (!linha) continue;
      if (linha.startsWith("PING")){ ws.send("PONG :tmi.twitch.tv"); continue; }

    }

function dizerNoChat(texto){
  if (!BOT_TOKEN || !wsChat || wsChat.readyState !== 1 || !CONFIG.canal) return false;
  try { wsChat.send("PRIVMSG #" + CONFIG.canal.toLowerCase().replace(/^#/, "") + " :" + texto); return true; } catch(e){ return false; }

function lerLinha(linha){
  const tags = {}; let resto = linha;
  if (resto[0] === "@"){
    const sp = resto.indexOf(" ");
    resto.slice(1, sp).split(";").forEach(kv => { const i = kv.indexOf("="); tags[kv.slice(0,i)] = kv.slice(i+1); });
    resto = resto.slice(sp+1);
  }
  if (/ ROOMSTATE #/.test(resto)){ conectado = true; avisouCanal = false; clearTimeout(timerCanal); atualizarStatus(); return; }
  const m = /^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/.exec(resto);
  if (!m) return;
  const badges = tags["badges"] || "";
  const ehDona = /(^|,)broadcaster\//.test(badges);
  const nome = (tags["display-name"] || m[1]).replace(/\\s/g, " ");
  aoMensagem(m[1], nome, m[2], tags["mod"] === "1", ehDona);
}

/* ===== premiação em pontos do canal (StreamElements) ===== */
async function premiarSE(lista){
  if (DEMO || !CONFIG.seToken || !CONFIG.seConta || CONFIG.sePremiar === "desligado") return;
  let ganhos = [];
  if (CONFIG.sePremiar === "campeao" && lista[0]) ganhos = [[lista[0], CONFIG.sePremio1]];
  else if (CONFIG.sePremiar === "top3") ganhos = lista.slice(0, 3).map((r, i) => [r, [CONFIG.sePremio1, CONFIG.sePremio2, CONFIG.sePremio3][i]]);
  else if (CONFIG.sePremiar === "todos") ganhos = lista.map(r => [r, Math.floor(r.pts / Math.max(1, CONFIG.seTaxa))]);
  ganhos = ganhos.filter(g => g[0] && g[0].login && g[1] > 0);
  for (const [r, v] of ganhos){
    try {
      const resp = await fetch("https://api.streamelements.com/kappa/v2/points/" + encodeURIComponent(CONFIG.seConta) + "/" + encodeURIComponent(r.login) + "/" + v, {
        method: "PUT", headers: { Authorization: "Bearer " + CONFIG.seToken, Accept: "application/json" }
      });
      if (!resp.ok) throw resp.status;
      popup("NUBYACOINS", '<span class="u">' + esc(r.nome) + '</span> ganhou <b>' + fmt(v) + '</b> nubyacoins!', 8000);
    } catch(e){
      popup("NUBYACOINS", "não consegui premiar " + esc(r.nome) + " — confira o token do StreamElements no painel", 8000);
      break;
    }
    await new Promise(res => setTimeout(res, 400));
  }
}

  }

    if (b.id === "fadd"){
      const t = $("#fnova").value.trim(); if (!t) return st("Escreva a fala antes de adicionar.");
      const cat = $("#fcat").value, cus = lsGet(K_FALAS, {}); (cus[cat] = cus[cat] || []).push(t); lsSet(K_FALAS, cus);
      $("#fnova").value = ""; bumpRev(); listarFalas(); return st("Fala adicionada!");
    }
    if (b.dataset.ed != null || b.dataset.tg != null){
      const l = linhasAtuais[+(b.dataset.ed != null ? b.dataset.ed : b.dataset.tg)]; if (!l) return;
      const fonte = $("#pfonte").value;
      if (b.dataset.ed != null){
        editando = { tipo: l.tipo, fonte, chave: l.chave, idx: l.idx };
        $("#f_q").value = l.q[0]; $("#f_c").value = l.q[1]; $("#f_e1").value = l.q[2]; $("#f_e2").value = l.q[3]; $("#f_e3").value = l.q[4];
        $("#ptituloform").textContent = "EDITANDO PERGUNTA — salvar grava a sua versão";
      } else {
        if (l.tipo === "custom"){ const cus = lsGet(K_CUS, {}); (cus[fonte] || []).splice(l.idx, 1); lsSet(K_CUS, cus); }
        else { const off = lsGet(K_OFF, []); const i = off.indexOf(l.chave); i >= 0 ? off.splice(i, 1) : off.push(l.chave); lsSet(K_OFF, off); }
        bumpRev(); listar(); st("Alteração salva.");
      }
      return;
    }
    if (b.id === "psalvar"){
      const v = ["f_q","f_c","f_e1","f_e2","f_e3"].map(id => $("#" + id).value.trim());
      if (v.some(x => !x)) return st("Preencha a pergunta, a certa e as 3 erradas.");
      if (new Set(v.slice(1)).size !== 4) return st("As 4 alternativas precisam ser diferentes entre si.");
      const fonte = editando ? editando.fonte : $("#pfonte").value;
      const cus = lsGet(K_CUS, {}); cus[fonte] = cus[fonte] || [];
      if (editando && editando.tipo === "custom") cus[fonte][editando.idx] = v;
      else {
        if (editando && editando.tipo === "base"){ const off = lsGet(K_OFF, []); if (!off.includes(editando.chave)){ off.push(editando.chave); lsSet(K_OFF, off); } }
        cus[fonte].push(v);
      }
      lsSet(K_CUS, cus); bumpRev(); limparForm(); listar(); st("Pergunta salva.");
      return;
    }
    if (b.id === "plimpar") return limparForm();
    if (b.id === "pexp"){
      $("#pbk").value = JSON.stringify({ v:1, exportadoEm: new Date().toISOString(), db: lsGet(KEY, {}), custom: lsGet(K_CUS, {}), off: lsGet(K_OFF, []), cfg: lsGet(K_CFG, {}), falas: lsGet(K_FALAS, {}), falasOff: lsGet(K_FALAS_OFF, []) });
      return st("Backup gerado. Copie o texto e guarde num lugar seu.");
    }
    if (b.id === "pcopy"){
      $("#pbk").select();
      try { document.execCommand("copy"); st("Copiado!"); } catch(e){ st("Selecione o texto e copie com Ctrl+C."); }
      return;
    }
    if (b.id === "pimp"){
      try {
        const d = JSON.parse($("#pbk").value);
        if (!d || typeof d !== "object" || !("db" in d)) throw 0;
        lsSet(KEY, d.db || {}); lsSet(K_CUS, d.custom || {}); lsSet(K_OFF, d.off || []); lsSet(K_CFG, d.cfg || {});
        lsSet(K_FALAS, d.falas || {}); lsSet(K_FALAS_OFF, d.falasOff || []);
        bumpRev(); listar(); st("Backup importado! O jogo recarrega os dados sozinho em instantes.");
      } catch(e){ st("Não entendi esse backup. Cole o texto exatamente como foi exportado."); }
      return;
    }
    if (b.id === "s_testar"){
      const tok = $("#s_token").value.trim();
      if (!tok) return st("Cole o JWT Token primeiro.");
      st("Testando a conexão com o StreamElements...");
      fetch("https://api.streamelements.com/kappa/v2/channels/me", { headers: { Authorization: "Bearer " + tok, Accept: "application/json" } })
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(d => {
          if (d && d._id){ $("#s_conta").value = d._id; st("Conectado! Canal: " + (d.displayName || d.username || d._id) + ". Agora clique em Salvar configurações."); }
          else st("O StreamElements respondeu, mas sem os dados esperados.");
        })
        .catch(e => st("Não conectou (" + e + "): confira se o token foi copiado inteiro."));
      return;
    }
    if (b.id === "pcfg"){
      lsSet(K_CFG, {
        canal: $("#c_canal").value.trim(), lado: $("#c_lado").value,
        perguntasPorRodada: +$("#c_rod").value || CONFIG.perguntasPorRodada,
        tempoPergunta: +$("#c_tp").value || CONFIG.tempoPergunta,
        tempoRelampago: +$("#c_tr").value || CONFIG.tempoRelampago,
        tempoResultado: +$("#c_tres").value || CONFIG.tempoResultado,
        chanceRelampago: Math.min(100, Math.max(0, +$("#c_cr").value || 0)) / 100,
        som: $("#c_som").checked, mostrarVotosAoVivo: $("#c_votos").checked,
        trilha: $("#c_trilha").checked,
        plateia: $("#c_plateia").checked,
        plateiaEmCima: $("#c_platcima").checked,
        mascote: $("#c_mascote").checked,
        volume: Math.min(100, Math.max(0, +$("#c_vol").value || 0)) / 100,
        pesoVelocidade: Math.min(100, Math.max(0, +$("#c_peso").value || 0)) / 100,
        janelaVelocidade: Math.max(1, +$("#c_jan").value || 8),
        penalidadeErro: Math.max(0, +$("#c_pen").value || 0),
        sePremiar: $("#s_modo").value,
        sePremio1: +$("#s_p1").value || 0, sePremio2: +$("#s_p2").value || 0, sePremio3: +$("#s_p3").value || 0,
        seTaxa: Math.max(1, +$("#s_taxa").value || 10),
        seConta: $("#s_conta").value.trim(), seToken: $("#s_token").value.trim()
      });
      bumpRev(); return st("Configurações salvas.");
    }
  });
  $("#pfonte").addEventListener("change", () => { limparForm(); listar(); });
  $("#pbusca").addEventListener("input", listar);
  $("#fcat").addEventListener("change", listarFalas);
  if ($("#twbot")) $("#twbot").addEventListener("change", pintarTwitch);
  listar(); listarFalas();
}

/* ================= TECLADO (OBS > Interagir) ================= */
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  const mapa = { enter:"", " ":"", p:"pausa", s:"pular", r:"ranking", f:"fim", l:"relampago", m:"som" };
  if (k === "h"){ comando(win.classList.contains("fechada") ? "abrir" : "fechar", true); return; }
  if (k in mapa) comando(mapa[k], true);
});

function demoVotos(){
  const q = atual;
  embaralhar(NOMES).slice(0, 8 + Math.floor(Math.random()*12)).forEach(nome => {
    const acerta = Math.random() < 0.65;
    const i = acerta ? q.certa : Math.floor(Math.random()*4);
    setTimeout(()=>{ if (atual === q && estado === "pergunta") aoMensagem(nome.toLowerCase(), nome, LETRAS[i], false, false); }, 600 + Math.random()*q.dur*0.7);

if (PAINEL){
  document.body.classList.add("painel");
  montarPainel();
} else {
  aplicarConfig(); aplicarBanco(); aplicarFalas();
  try { REV_ATUAL = localStorage.getItem(K_REV); } catch(e){}
  win.classList.remove("direita", "esquerda"); win.classList.add(CONFIG.lado === "esquerda" ? "esquerda" : "direita");
  posicionarColuna();
  mascoteInit();
  if (DEMO){ document.body.classList.add("demo"); CONFIG.tempoPergunta = 12; CONFIG.tempoRelampago = 8; CONFIG.tempoResultado = 6; CONFIG.perguntasPorRodada = 5; }
  if (!CONFIG.canal && !DEMO){ mostrarEntrada(); }
  else { mostrarAbertura(); conectar(); }
  setInterval(pollPainel, 1000);
  if (DEMO) setTimeout(()=>comando("", true), 2500);
}
